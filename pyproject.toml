[project]
name = "hpsc-mcp"
version = "0.3.1"
description = "MCP server for Health Product Shortages Canada (drug shortages and discontinuations) plus Health Canada's Drug Product Database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hpsc-mcp = "hpsc_mcp.server:main"
hpsc-dashboard = "hpsc_mcp.dashboard:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hpsc_mcp"]

[tool.setuptools.package-data]
hpsc_mcp = ["dashboard_template.html"]
